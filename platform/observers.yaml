apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
  namespace: platform-observers
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observer
  namespace: platform-observers
rules:
  - apiGroups: ['']
    resources: [services/proxy]
    resourceNames: ['http:prometheus:9090']
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observer
  namespace: platform-observers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observer
subjects:
  - kind: ServiceAccount
    name: observer
    namespace: platform-observers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observer-config
  namespace: platform-observers
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlp_http/jaeger:
        endpoint: http://jaeger:4318
        timeout: 2s
        sending_queue:
          queue_size: 256
          num_consumers: 1
        retry_on_failure:
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 60s
      prometheus:
        endpoint: 0.0.0.0:8889
        metric_expiration: 15s
        translation_strategy: UnderscoreEscapingWithSuffixes
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
      resource/member:
        attributes:
          - key: platform_member
            value: __MEMBER__
            action: upsert
      batch:
        timeout: 1s
        send_batch_size: 128
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/member, batch]
          exporters: [otlp_http/jaeger]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
  jaeger.yaml: |
    extensions:
      jaeger_storage:
        backends:
          demo:
            memory:
              max_traces: 5000
      jaeger_query:
        storage:
          traces: demo
        http:
          endpoint: 0.0.0.0:16686
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      jaeger_storage_exporter:
        trace_storage: demo
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [jaeger_storage_exporter]
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
    scrape_configs:
      - job_name: sample-api
        static_configs:
          - targets: ['collector:8889']
            labels:
              member: __MEMBER__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: platform-observers
spec:
  replicas: 1
  selector:
    matchLabels:
      role: collector
  template:
    metadata:
      annotations:
        platform.example.com/config-sha256: __CONFIG_SHA256__
      labels:
        role: collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: __COLLECTOR_IMAGE__
          args: ['--config=/config/collector.yaml']
          ports:
            - containerPort: 4318
            - containerPort: 8889
          readinessProbe:
            tcpSocket:
              port: 4318
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observer-config
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: platform-observers
spec:
  selector:
    role: collector
  ports:
    - name: otlp
      port: 4318
    - name: metrics
      port: 8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: platform-observers
spec:
  replicas: 1
  selector:
    matchLabels:
      role: prometheus
  template:
    metadata:
      labels:
        role: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: __PROMETHEUS_IMAGE__
          args: ['--config.file=/config/prometheus.yml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=1h']
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: observer-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: platform-observers
spec:
  selector:
    role: prometheus
  ports:
    - name: http
      port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: platform-observers
spec:
  replicas: 1
  selector:
    matchLabels:
      role: jaeger
  template:
    metadata:
      annotations:
        platform.example.com/config-sha256: __CONFIG_SHA256__
      labels:
        role: jaeger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: __JAEGER_IMAGE__
          args: ['--config=/config/jaeger.yaml']
          ports:
            - containerPort: 4318
            - containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: 16686
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observer-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: platform-observers
spec:
  selector:
    role: jaeger
  ports:
    - name: otlp
      port: 4318
    - name: query
      port: 16686
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-ingress
  namespace: platform-observers
spec:
  podSelector:
    matchLabels:
      role: jaeger
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: collector
      ports:
        - protocol: TCP
          port: 4318
