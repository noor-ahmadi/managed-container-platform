apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicedefinitions.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    kind: ServiceDefinition
    plural: servicedefinitions
    singular: servicedefinition
    shortNames: [service-def]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 40
              message: Service names must be at most 40 characters.
          properties:
            spec:
              type: object
              required: [template, imageRepository, port, readinessPath, sizingProfile, placementProfile]
              properties:
                template:
                  type: string
                  enum: [http-api]
                imageRepository:
                  type: string
                  maxLength: 253
                  pattern: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$'
                port:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                readinessPath:
                  type: string
                  maxLength: 128
                  pattern: '^/'
                sizingProfile:
                  type: string
                  enum: [small]
                placementProfile:
                  type: string
                  enum: [two-region]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: releases.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    kind: Release
    plural: releases
    singular: release
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.serviceName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Gate
          type: string
          jsonPath: .status.gatePolicy
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [serviceName, serviceUID, serviceGeneration, image]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Release spec is immutable. Create a new release.
              properties:
                serviceName:
                  type: string
                  maxLength: 40
                  pattern: '^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$'
                serviceUID:
                  type: string
                  pattern: '^[a-f0-9-]{36}$'
                serviceGeneration:
                  type: integer
                  minimum: 1
                image:
                  type: string
                  maxLength: 400
                  pattern: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'
                restoreRelease:
                  type: string
                  maxLength: 63
                  pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
